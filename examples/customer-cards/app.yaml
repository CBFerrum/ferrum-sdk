# A third-party app with an interface of its own and no plugin (Ferrum docs/plugins.md, "Interfaces
# of their own"). Uploaded unsigned to one workspace, its interface runs isolated: in a sandboxed
# frame under the bar, without the person's session, reaching Ferrum only through the bridge
# (ui/ferrum.js) and only as far as `access` declares, within the person's own rights.
id: customer-cards
name: Customer Cards
version: 1.0.0
publisher: acme
summary: Your customers as cards, with search
description: README.md
categories: [crm]
license: Apache-2.0
icon: assets/icon.svg
screenshots: [assets/cards.png]
runtime: meta
platform: ">=0.3.2, <0.4"
access:
  - {entity: Customer, read: true}
ui:
  dist: ui
contributes:
  shell.app:
    - {id: cards, route: customer-cards, title: Customer cards, description: Your customers as cards, icon: contact}
