name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ferrum-sdk
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ferrum-sdk
      - name: Format
        working-directory: ferrum-sdk
        run: |
          cargo fmt -p ferrum-app --check
          cargo fmt --manifest-path plugin-sdk/Cargo.toml --check
      - name: Clippy
        working-directory: ferrum-sdk
        run: |
          cargo clippy -p ferrum-app --all-targets -- -D warnings
          cargo clippy --manifest-path plugin-sdk/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      - name: Test
        working-directory: ferrum-sdk
        run: cargo test -p ferrum-app
      # A placeholder in a template's Cargo.toml once made this repository unusable as a git
      # dependency, so nothing scaffolded could build; the tests above could not see that.
      - name: A scaffolded plugin builds against this repository
        working-directory: ferrum-sdk
        run: |
          cargo run -q -p ferrum-app -- new ci-plugin --runtime wasm --publisher acme --name "CI Plugin"
          cargo build --manifest-path ci-plugin/plugin/Cargo.toml --target wasm32-unknown-unknown --config "patch.\"https://github.com/CBFerrum/ferrum-sdk\".ferrum-plugin-sdk.path=\"$PWD/plugin-sdk\""
